# Five-real-turn HCV terminal-rejection SFT.  The 16k context is required to
# retain all public evidence and the sixth rejected-call correction.
model: outputs/vlm_sft/qwen3_vl_4b_m1_current_contract_direct_b2/v0-20260819-155739/checkpoint-18
model_type: qwen3_vl
template: qwen3_vl
agent_template: manual_json
loss_scale: manual_json
torch_dtype: bfloat16
attn_impl: sdpa
use_liger_kernel: true
tuner_type: full
freeze_vit: false
