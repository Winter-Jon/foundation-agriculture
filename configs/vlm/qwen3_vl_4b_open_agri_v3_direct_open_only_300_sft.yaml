model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
agent_template: hermes
loss_scale: hermes
torch_dtype: bfloat16
attn_impl: flash_attn
use_liger_kernel: true
tuner_type: full
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
vit_gradient_checkpointing: true
dataset: [outputs/artifacts/datasets/open-agri-v3-four-arm-sft-v1/views/direct-open-only/data.jsonl]
split_dataset_ratio: 0.0
max_length: 16384
truncation_strategy: left
max_steps: 300
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
save_strategy: steps
save_steps: 50
save_total_limit: 6
save_only_model: false
logging_steps: 5
seed: 42
data_seed: 42
output_dir: outputs/vlm_sft/qwen3_vl_4b_open_agri_v3_direct_open_only_300
dataloader_num_workers: 8
dataset_num_proc: 8
deepspeed: zero3
report_to: [tensorboard]
