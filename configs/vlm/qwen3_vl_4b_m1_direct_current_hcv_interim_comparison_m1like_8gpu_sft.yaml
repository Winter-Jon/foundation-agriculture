# Long-chain M1-comparison derivative of the user-authorized interim Direct set.
# It intentionally mirrors the historical M1 optimization budget while keeping
# the current Direct student contract and its separate output namespace.
model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
torch_dtype: bfloat16
attn_impl: sdpa
use_liger_kernel: true
tuner_type: full
freeze_vit: false
freeze_llm: false
freeze_aligner: false
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
vit_gradient_checkpointing: true
dataset: [outputs/artifacts/datasets/m1-direct-current-hcv-v1/interim-sft-m1-comparison-v1/data.jsonl]
split_dataset_ratio: 0.0
streaming: false
max_length: 16384
truncation_strategy: left
num_train_epochs: 5
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
warmup_ratio: 0.05
save_strategy: epoch
save_total_limit: 5
save_only_model: true
logging_steps: 1
output_dir: outputs/vlm_sft/qwen3_vl_4b_m1_direct_current_hcv_interim_comparison_m1like_8gpu
dataloader_num_workers: 8
dataset_num_proc: 8
deepspeed: zero3
