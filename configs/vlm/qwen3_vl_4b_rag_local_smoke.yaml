model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
torch_dtype: bfloat16
attn_impl: sdpa
use_liger_kernel: true
tuner_type: full
freeze_vit: false
freeze_llm: false
freeze_aligner: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
vit_gradient_checkpointing: true
dataset:
  - outputs/vlm_sft/rag_distill/agent_sft.student.singleimg.jsonl
split_dataset_ratio: 0.0
max_length: 2048
num_train_epochs: 1
max_steps: 2
per_device_train_batch_size: 1
learning_rate: 1.0e-5
gradient_accumulation_steps: 1
save_steps: 1
save_total_limit: 1
save_only_model: true
logging_steps: 1
output_dir: outputs/runs/vlm-smoke/qwen3vl4b-rag-sft-smoke-v1
dataloader_num_workers: 2
dataset_num_proc: 2
report_to:
  - tensorboard
