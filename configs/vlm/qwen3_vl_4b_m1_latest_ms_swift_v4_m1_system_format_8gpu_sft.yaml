model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
torch_dtype: bfloat16
attn_impl: flash_attn
use_liger_kernel: true
tuner_type: full
freeze_vit: false
freeze_llm: false
freeze_aligner: false
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
vit_gradient_checkpointing: true
dataset: [outputs/artifacts/datasets/m1-direct-current-hcv-v1/terminal-v5-m1-comparison-user-guidance-v4-m1-system-format/data.jsonl]
split_dataset_ratio: 0.0
streaming: false
max_length: 2048
truncation_strategy: delete
num_train_epochs: 5
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.05
save_strategy: epoch
save_total_limit: 5
save_only_model: true
logging_steps: 5
seed: 42
data_seed: 42
output_dir: outputs/vlm_sft/qwen3_vl_4b_m1_latest_ms_swift_v4_m1_system_format_8gpu
dataloader_num_workers: 8
dataset_num_proc: 8
deepspeed: zero3
