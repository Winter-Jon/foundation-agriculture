# M3.5 execution reproduction with the current PyPI ms-swift runtime.
# The historical manual_json extension is unavailable in this runtime, so use
# ms-swift's maintained Hermes agent/loss contract without a local checkout.
model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
agent_template: hermes
loss_scale: hermes
torch_dtype: bfloat16
attn_impl: flash_attn
use_liger_kernel: true
tuner_type: full
freeze_vit: false
freeze_llm: false
freeze_aligner: false
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
vit_gradient_checkpointing: true
dataset: [outputs/artifacts/agrinet-hcv-manual-json-v12-direct-anchor-mix/data.jsonl]
split_dataset_ratio: 0.0
streaming: false
max_length: 16384
truncation_strategy: left
num_train_epochs: 9
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-6
warmup_ratio: 0.05
save_strategy: epoch
save_total_limit: 9
save_only_model: true
logging_steps: 1
seed: 42
data_seed: 42
output_dir: outputs/vlm_sft/qwen3_vl_4b_hcv_v12_direct_anchor_mix_base_m35_e9_pypi_hermes
dataloader_num_workers: 8
dataset_num_proc: 8
deepspeed: zero3
