model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
agent_template: hermes
loss_scale: hermes
torch_dtype: bfloat16
attn_impl: flash_attn
use_liger_kernel: true
tuner_type: full
freeze_vit: false
freeze_llm: false
freeze_aligner: false
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
vit_gradient_checkpointing: true
dataset: [outputs/artifacts/datasets/agrinet-dual-teacher-full-tool-sft-v1/data.jsonl]
split_dataset_ratio: 0.0
streaming: false
packing: false
max_length: 16384
# ms-swift CLI maps delete to template raise; strict prevents row dropping.
truncation_strategy: delete
strict: true
num_train_epochs: 6
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-6
warmup_ratio: 0.05
lr_scheduler_type: cosine
save_strategy: epoch
save_total_limit: 6
save_only_model: false
logging_steps: 1
seed: 42
data_seed: 42
output_dir: outputs/runs/vlm/vlm-full-tool-sft-v1/pending/checkpoints
dataloader_num_workers: 4
dataset_num_proc: 4
deepspeed: zero3
report_to: [tensorboard]
