model: models/Qwen3-VL-8B-Instruct
model_type: qwen3_vl
template: qwen3_vl
agent_template: hermes
loss_scale: hermes
torch_dtype: bfloat16
attn_impl: flash_attn
use_liger_kernel: true
external_plugins: [src/agrinet/vlm/weighted_liger_plugin.py]
tuner_type: full
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
vit_gradient_checkpointing: true
dataset: [outputs/artifacts/datasets/open-agri-v3-direct-anchor-rag-600-longtail-v1/data.jsonl]
split_dataset_ratio: 0.0
max_length: 16384
truncation_strategy: left
max_steps: 8
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
packing: true
packing_length: 16384
packing_num_proc: 1
packing_strategy: sequential
lazy_tokenize: false
learning_rate: 2.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.05
save_strategy: "no"
logging_steps: 1
seed: 42
data_seed: 42
output_dir: outputs/vlm_sft/qwen3_vl_8b_open_agri_v3_direct_anchor_rag_600_preflight_packing
dataloader_num_workers: 8
dataset_num_proc: 8
deepspeed: zero3
report_to: [tensorboard]
