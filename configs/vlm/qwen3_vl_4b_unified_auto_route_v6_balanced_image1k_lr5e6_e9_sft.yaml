model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
agent_template: hermes
loss_scale: hermes
torch_dtype: bfloat16
attn_impl: flash_attn
use_liger_kernel: true
tuner_type: full
freeze_vit: false
freeze_llm: false
freeze_aligner: false
gradient_checkpointing: true
gradient_checkpointing_kwargs: {use_reentrant: false}
vit_gradient_checkpointing: true
dataset: [outputs/artifacts/datasets/agrinet-e343-three-route-sft-v6-balanced-image1k/data.jsonl]
split_dataset_ratio: 0.0
streaming: false
max_length: 16384
truncation_strategy: left
num_train_epochs: 9
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
warmup_ratio: 0.05
lr_scheduler_type: cosine
save_strategy: steps
save_steps: 24
save_total_limit: 3
save_only_model: true
logging_steps: 1
seed: 42
data_seed: 42
output_dir: outputs/vlm_sft/qwen3_vl_4b_unified_auto_route_v6_balanced_image1k_lr5e6_e9_b1ga8
dataloader_num_workers: 8
dataset_num_proc: 8
deepspeed: zero3
report_to: [tensorboard]
