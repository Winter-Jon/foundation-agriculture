output_root: outputs/runs/data-teacher
exp_name: agrinet_bounded_contrast_v1
template_dir: templates/vloom
max_concurrent: 2
log_level: INFO
log_interval: 1
dry_run: false
imports: [tools.vloom_agrinet]
model:
  model_name: gemini-3.1-pro-preview
  base_url: https://yunwu.ai/v1
  api_key: ""
  dry_run: false
  generation_kwargs:
    max_tokens: 2048
    temperature: 0.0
    top_p: 0.9
    max_image_size: 1024
    timeout: 300
datasets:
  - type: agrinet_contrast
    name: agrinet_bounded_contrast_v1
    description: Eight-sample bounded disease/pest teacher collection
    data_root: .
    class_file: outputs/artifacts/datasets/agrinet-bounded-contrast-v1/classes.jsonl
    knowledge_file: outputs/artifacts/datasets/agrinet-bounded-contrast-v1/classes.jsonl
    pairs_file: outputs/artifacts/datasets/agrinet-bounded-contrast-v1/pairs.jsonl
    sample_file: outputs/artifacts/datasets/agrinet-bounded-contrast-v1/samples.jsonl
    max_samples: 8
    candidates_per_item: 4
    include_references: true
    include_wiki: true
    allow_missing_data: false
    recursive_fallback: false
task_definitions:
  - type: default
    name: agrinet_contrast_cot
    description: Bounded disease/pest teacher annotation
    agent_type: optional_image_basic
    templates: {usr: task/agrinet_contrast_cot.j2}
    image_config: {max_image_size: 1024}
run_tasks: [agrinet_contrast_cot]
