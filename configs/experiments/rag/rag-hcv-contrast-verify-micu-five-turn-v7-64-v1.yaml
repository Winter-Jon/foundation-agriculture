schema_version: agrinet.experiment/v1
id: rag-hcv-contrast-verify-micu-five-turn-v7-64-v1
display_name:
  en: HCV Micu five-turn v7 balanced 64-row collection
  zh: HCV Micu 五轮 v7 均衡64条采集
domain: rag
task: distill
description: >-
  Fresh image-isolated Blind HCV collection for the retention-aware v7 route.
  It uses eight public-evidence-qualified trajectories in each Open/Option,
  English/Chinese, disease/pest cell. Every accepted row must complete five
  real public retrievals before answering; a separate private audit decides
  whether any row may enter an immutable SFT freeze.
lifecycle: active
components:
  retrieval: retrieval/siglip2-milvus-v1
  runtime: runtime/local-rag
runtime_profile: runtime/local-rag
parameters:
  credential_profile: micu_slb
  plan_file: outputs/experiments/hcv_multi_query_rag/teacher_plan/20260823Tv7-five-turn-8-per-cell/teacher_plan.jsonl
  rag_api: http://127.0.0.1:8078
  output_dir: outputs/experiments/hcv_multi_query_rag/teacher_collection/20260823Tv7-five-turn-8-per-cell
  model: gpt-5.6-terra
  limit: 64
  max_concurrent: 1
  max_tool_turns: 5
  top_k: 3
  temperature: 0.0
  max_tokens: 4096
  teacher_timeout: 180
  teacher_retries: 3
  teacher_retry_sleep: 5.0
tags: [hcv, contrast-verify, five-turn, v7, image-isolated, blind-evidence, micu-slb, balanced-64]
