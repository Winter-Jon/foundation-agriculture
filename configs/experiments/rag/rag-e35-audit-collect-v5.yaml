  to RAG and requires a real retained RAG call/response at the RAG terminal.
lifecycle: active
parameters:
  manifest: outputs/artifacts/e35-dual-arm-rag-distill/manifests/e35-dual-arm-audit-v5-r0.json
  source: outputs/artifacts/e35-dual-arm-rag-distill/audit-source-balanced-v5.jsonl
  output: outputs/artifacts/e35-dual-arm-rag-distill/outcomes/e35-dual-arm-audit-v5-r0.json
  output_root: outputs/artifacts/e35-dual-arm-rag-distill/campaigns/e35-dual-arm-audit-v5
  rag_endpoint: http://127.0.0.1:8077
  private_registry: datasets/AgriNet-1K/open_agri_v3/taxonomy/canonical_label_registry.jsonl
  teacher_model: gpt-5.6-sol
  teacher_base_url: https://api-slb.micuapi.ai/v1
  timeout: 180
outputs: {run_root: outputs/runs/rag/rag-e35-audit-collect-v5/}
tags: [e35, audit, live-collection, rag-witness, private-audit, fresh-lineage, no-sft]
