schema_version: agrinet.experiment/v1
id: rag-e35-audit-collect-v5
display_name: {en: E3.5 private RAG-witness audit collection, zh: E3.5 私有 RAG 见证审计采集}
domain: rag
task: e35_live_audit_collect
description: >-
