    - outputs/artifacts/vision/openagri-v3-known-vitl-e3-adjacent-classfold-v1/fold-1/manifests/train.jsonl
    - outputs/artifacts/vision/openagri-v3-known-vitl-e3-adjacent-classfold-v1/fold-2/manifests/train.jsonl
  registry_sha256: 4fa6426203c64631315a2d754f3d53d6c3a7639e26c1c8617b2cbf92caf00cb8
