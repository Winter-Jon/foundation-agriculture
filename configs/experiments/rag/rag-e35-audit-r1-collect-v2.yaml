schema_version: agrinet.experiment/v1
id: rag-e35-audit-r1-collect-v2
display_name: {en: E3.5 audit R1 recovery collection, zh: E3.5 审计 R1 恢复采集}
domain: rag
task: e35_live_audit_collect
description: >-
  Executes only the immutable R1 recovery manifest for unconfirmed E3.5 audit
  deliveries. It cannot select replacement images or start SFT/training.
lifecycle: active
parameters:
  manifest: outputs/artifacts/e35-dual-arm-rag-distill/manifests/e35-dual-arm-audit-v2-r1.json
  source: outputs/artifacts/e35-dual-arm-rag-distill/audit-source-balanced-v2.jsonl
  output: outputs/artifacts/e35-dual-arm-rag-distill/outcomes/e35-dual-arm-audit-v2-r1.json
  output_root: outputs/artifacts/e35-dual-arm-rag-distill/campaigns/e35-dual-arm-audit-v2
  rag_endpoint: http://127.0.0.1:8077
  private_registry: datasets/AgriNet-1K/open_agri_v3/taxonomy/canonical_label_registry.jsonl
  teacher_model: gpt-5.6-terra
  teacher_base_url: https://api-slb.micuapi.ai/v1
  timeout: 180
outputs: {run_root: outputs/runs/rag/rag-e35-audit-r1-collect-v2/}
tags: [e35, audit, r1, recovery, no-sft]
