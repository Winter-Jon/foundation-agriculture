  plan_file: outputs/experiments/hcv_multi_query_rag/teacher_plan/20260823T002510-micu-replacement-complete/teacher_plan.jsonl
  rag_api: http://127.0.0.1:8077
  output_dir: outputs/experiments/hcv_multi_query_rag/teacher_collection/20260823T002600-micu-slb-terra-repaired
  model: gpt-5.6-terra
  limit: 32
  max_concurrent: 1
  max_tool_turns: 2
  top_k: 3
  temperature: 0.2
  max_tokens: 2048
  teacher_timeout: 180
  teacher_retries: 3
  teacher_retry_sleep: 5.0
tags: [hcv, blind-evidence, visual-expand, micu-slb, terra, serialized, image-isolated]
