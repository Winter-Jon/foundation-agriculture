schema_version: agrinet.experiment/v1
id: rag-hcv-visual-expand-teacher-collection-v1
display_name: {en: HCV blind visual-expansion teacher collection, zh: HCV 盲证据视觉扩展教师采集}
domain: rag
task: distill
description: >-
  Serialized Micu SLB collection of the complete image-isolated HCV plan. Each
