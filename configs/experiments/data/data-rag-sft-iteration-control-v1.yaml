schema_version: agrinet.experiment/v1
id: data-rag-sft-iteration-control-v1
display_name:
  en: RAG SFT iteration control and review gates
  zh: RAG SFT 数据迭代控制与审阅门
domain: data
task: iteration_control
description: Codex-executed bounded data, training, and evaluation iteration control; trajectory compliance is a hard priority.
lifecycle: active
components: {data: data/agrinet-disease-pest-current-v1, runtime: runtime/local-data}
runtime_profile: runtime/local-data
outputs:
  state_root: outputs/experiments/rag_sft_iteration
inputs:
  corrected_eval: outputs/vlm_eval/qwen3_vl_4b_rag_sft/dual_route_v2_checkpoint64_rag_protocol_corrected_20260809
  nonrag_eval: outputs/vlm_eval/qwen3_vl_4b_rag_sft/nonrag_checkpoint165_direct_full_20260804
  prior_rag_eval: outputs/vlm_eval/qwen3_vl_4b_rag_sft/nonrag_init_rag_sft_checkpoint224_rag_full_20260805
  base_dataset: outputs/artifacts/datasets/agrinet-rag-dual-route-sft-v2-singleimg/data.jsonl
  base_checkpoint: outputs/vlm_sft/qwen3_vl_4b_disease_pest_full_all_e5_len2048_liger_lr1e5_final/v0-20260531-231355/checkpoint-165
parameters:
  priorities: [trajectory_compliance, autonomous_rag_routing, performance]
  hard_gates:
    protocol_error_count: 0
    semantic_error_count: 0
    tool_schema_valid_rate: 1.0
    retrieval_success_rate: 1.0
    evidence_supported_rate: 1.0
    language_mismatch_count: 0
    option_contract_error_count: 0
    open_contract_error_count: 0
    oracle_premature_label_count: 0
    blind_label_exposure_count: 0
    eval_image_overlap_count: 0
    unknown_label_leak_count: 0
  budgets:
    micro_pilot_attempts: 16
    validation_sft_rag_rows: 32
    validation_sft_direct_rows: 32
    scaled_rag_rows: 512
    scaled_rag_rows_per_cell: 64
    scaled_direct_rows: 256
    scaled_min_unique_classes_per_cell: 16
    scaled_max_rows_per_class_per_cell: 4
    max_teacher_attempts_per_cell: 192
    calibration_attempts_per_cell: 12
    minimum_calibration_acceptance_rate: 0.25
    minimum_calibration_accepted_rows: 3
    smoke_eval_rows: 32
    validation_matched_eval_rows: 192
    full_eval_rows: 618
  approval_required_for: [full_618_evaluation, base_model_or_eval_protocol_change]
  stages:
    standard_intermediate:
      required_rag_rows: 32
      required_direct_rows: 32
      rag_cells: [standard/open/en/disease, standard/open/en/pest, standard/open/zh/disease, standard/open/zh/pest, standard/option/en/disease, standard/option/en/pest, standard/option/zh/disease, standard/option/zh/pest]
      display_name: standard_milestone
      purpose: protocol-and-signal validation SFT from checkpoint-165; not the final training-scale corpus
      corpus_rows: 64
      sampling_policy:
        allocation: stratified_by_remaining_cell_deficit
        final_rows_per_cell: 4
        within_cell_selection: randomized_fresh_eligible_targets
        stop_rule: stop_cell_when_four_strict_rows_are_accepted
        first_reserve_targets: 15
        replacement_target_release: automatic_only_after_isolation_and_preflight_review
      sft_requires_separate_approval: false
      required_evaluation: [forced_retrieval_off_protocol_smoke, matched_balanced_subgroup_diagnostic, checkpoint165_baseline_comparison, milestone_review_package]
      formal_618_request_requires_separate_approval: true
      post_sft_decision_gate:
        automatic_scaled_collection_release: true
        required_evidence: [forced_retrieval_off_protocol_smoke, matched_checkpoint165_manifest_diagnostic, subgroup_delta_review]
        outcomes:
          protocol_hard_gate_failure: repair_standard_protocol_or_template_then_new_standard_pilot
          autonomous_tool_use_insufficient: add_standard_blind_routing_examples_then_repeat_validation_sft
          answer_quality_insufficient: collect_targeted_strict_rows_then_repeat_validation_sft
          direct_regression: expand_validated_direct_replay_then_repeat_validation_sft
          robust_positive_result: auto_release_scaled_blind_rejection_sampling_then_final_internal_sft
      scaled_collection:
        trigger: validation_sft_has_zero_hard_gates_plus_paired_bootstrap_95pct_lower_bound_above_zero_and_at_least_3pp_rag_targeted_gain_without_unacceptable_subgroup_or_direct_regression
        accepted_data_policy: retain_only_individually_strict_accepted_rows
        raw_attempt_policy: rejection_sampling; raw_attempt_acceptance_need_not_be_100_percent
        allocation: balanced_floor_then_weak_cell_adaptive_allocation
        balanced_floor: 64_strict_rag_rows_per_open_option_language_domain_cell
        class_balance: at_least_16_unique_canonical_classes_and_at_most_4_rows_per_class_in_each_cell
        continuation_gate: at_least_3_strict_accepts_and_at_least_25_percent_acceptance_in_12_attempt_calibration_per_cell
        stop_conditions: [repeated_protocol_or_boundary_hard_gate, cell_attempt_cap, cell_target_reached, no_fresh_isolated_targets]
        final_internal_sft: one_run_per_unique_scaled_freeze_from_checkpoint165
        formal_618_request_requires_separate_approval: true
  round_1:
    focus: [autonomous_first_tool_call, option_answer_retention]
    attempts: 16
    balanced_dimensions: {language: [en, zh], question_type: [open, option], task_domain: [disease, pest], generation_route: [oracle_grounded, blind_evidence]}
    training_authorized: false
