parameters:
  credential_profile: micu_slb
  # Applied only to collection runs started after this immutable plan. Each
  # worker owns one teacher→label-blind-auditor sample pipeline.
  collection_workers: 8
  # User-authorized capacity-partial replenishment: collect only classes whose
  # full same-class shortfall can be supplied from fresh isolated candidates.
  # Capacity-blocked classes remain explicitly deferred; this never weakens the
  # per-class quota required by the eventual regular freeze.
  allow_capacity_partial_replenishment: true
  # User-authorized after v3: when a same-class isolated pool is exhausted, a
  # terminally rejected image from this Direct lineage may be re-run.  Static
  # evaluation/training/RAG exclusions and accepted groups remain forbidden.
  allow_retired_replay_replenishment: true
  class_target: 217
  images_per_class: 5
  views_per_image: 4
  teacher_model: gpt-5.6-terra
  auditor_model: gpt-5.6-terra
  seed: m1-direct-current-hcv-v1
  initialization_model: models/Qwen3-VL-4B-Instruct
  sft:
    devices: 8
    epochs: 3
    per_device_batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 2.0e-6
    deepspeed: zero3
    max_length: 16384
  evaluation:
    route: native_dp8_direct
    rows: 618
    paired_bootstrap_iterations: 10000
