schema_version: agrinet.experiment/v1
id: data-reconstructive-direct-blind-rag-v1
display_name:
  en: Reconstructive Direct and Blind RAG SFT data controls
  zh: 重建式 Direct 与 Blind RAG SFT 数据控制
domain: data
task: iteration_control
description: Immutable two-stage collection and freeze controls; this definition does not authorize a remote request by itself.
lifecycle: active
components:
  model: models/Qwen3-VL-4B-Instruct
  runtime: runtime/local-data
runtime_profile: runtime/local-data
outputs:
  state_root: outputs/experiments/reconstructive_direct_blind_rag_v1
parameters:
  sampling_contract: configs/sampling/reconstructive-blind-rag-contract-v1.yaml
  collection_specification: configs/sampling/reconstructive-blind-rag-collection-spec-v1.yaml
  teacher_model: gpt-5.6-terra
  initialization_model: models/Qwen3-VL-4B-Instruct
  stages:
    intermediate:
      sft: {max_length: 8192, epochs: 5, learning_rate: 1.0e-5, tuner: full, train_vit: true, train_llm: true, train_aligner: true}
      release_gate: {rag_min_gain_pp_vs_base: 3.0, rag_bootstrap_lower_bound_pp: 0.0, direct_nonnegative_subgroups: [overall, en, zh, disease, pest, open, option]}
    full:
      sft: {max_length: 8192, epochs: 5, learning_rate: 1.0e-5, tuner: full, train_vit: true, train_llm: true, train_aligner: true}
  hard_gates:
    image_isolation: true
    unknown_delivery: fail_closed_record_then_one_independent_resend
    direct_tool_free: true
    blind_label_visible_to_teacher: false
    rag_protocol_errors: 0
    diagnostic_rows: 192
    formal_618_evaluation: not_authorized
