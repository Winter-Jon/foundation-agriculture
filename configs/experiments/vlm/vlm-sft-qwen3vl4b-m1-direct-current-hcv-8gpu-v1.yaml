schema_version: agrinet.experiment/v1
id: vlm-sft-qwen3vl4b-m1-direct-current-hcv-8gpu-v1
display_name: {en: M1 Direct current-HCV rebuild from Qwen base, zh: M1 Direct 当前 HCV 重建（Qwen base）}
domain: vlm
task: sft
description: >-
  Direct-only M1-style rebuild. The immutable M1 Direct freeze is the sole
  dataset input; no RAG trace or tool trajectory is permitted.
lifecycle: active
components: {model: models/Qwen3-VL-4B-Instruct, runtime: runtime/local-a800-8gpu-train-and-eval}
runtime_profile: runtime/local-a800-8gpu-train-and-eval
inputs:
  config: configs/vlm/qwen3_vl_4b_m1_direct_current_hcv_8gpu_sft.yaml
  immutable_source: outputs/artifacts/datasets/m1-direct-current-hcv-v1/frozen/validation.json
outputs:
  model: outputs/vlm_sft/qwen3_vl_4b_m1_direct_current_hcv_8gpu
  run_root: outputs/runs/vlm/vlm-sft-qwen3vl4b-m1-direct-current-hcv-8gpu-v1/
parameters:
  entrypoint: scripts/vlm/run_m1_direct_checkpoint_queue.sh
  local_launch: {cuda_visible_devices: '0,1,2,3,4,5,6,7', nproc_per_node: 8, master_port: 29732, pytorch_cuda_alloc_conf: 'expandable_segments:True'}
  training_authorized: outputs/artifacts/datasets/m1-direct-current-hcv-v1/frozen/validation.json
  # Bound at launch to the SHA-256 of the authorized immutable validation file.
  # This avoids a mutable manual config handoff while retaining one-launch protection.
  freeze_sha256: from_training_authorized
  allowed_sft_runs_for_freeze_hash: 1
  m1_direct_freeze_audit: outputs/artifacts/datasets/m1-direct-current-hcv-v1/frozen/validation.json
  manifest: outputs/vlm_eval/qwen3_vl_4b_rag_sft/bounded_latest_sft_rag_test_20260804/manifest.jsonl
  checkpoint_specs: '1:0 2:0 3:0'
  direct_only: true
  sft: {initialization_model: models/Qwen3-VL-4B-Instruct, devices: 8, epochs: 3, per_device_batch_size: 2, gradient_accumulation_steps: 4, learning_rate: 2.0e-6, deepspeed: zero3, max_length: 16384}
  evaluation: {route: native_dp8_direct_618_each_epoch_checkpoint, paired_bootstrap_samples: 10000, promotion_gate: m1_direct_v1}
tags: [m1-direct, current-hcv, direct-only, qwen-base, e3, batch2, gradacc4, lr2e-6, zero3, eight-gpu]
