schema_version: agrinet.experiment/v1
id: vlm-direct-m1-reproduction-formal618-dp4-v1
display_name: {en: M1 reproduction native DP4 Direct-618 evaluation, zh: M1 重训原生 DP4 Direct-618 评测}
domain: vlm
task: formal_direct_evaluation_native_sglang
description: >-
  Same Direct-618 manifest, model generation parameters and scorer as native
  DP8 formal evaluation, executed with TP=1/DP=4 on GPUs 4--7 while v3 trains
  on GPUs 0--3. The only changed factor is evaluation data parallelism.
lifecycle: active
components: {runtime: sglang.launch_server, baseline_model: models/Qwen3-VL-4B-Instruct}
runtime_profile: runtime/local-a800-4gpu-eval
inputs:
  manifest: outputs/vlm_eval/qwen3_vl_4b_rag_sft/bounded_latest_sft_rag_test_20260804/manifest.jsonl
  candidate_checkpoint: outputs/vlm_sft/qwen3_vl_4b_m1_direct_reproduction_4gpu/v0-20260831-172308/checkpoint-165
  m1_checkpoint: outputs/vlm_sft/qwen3_vl_4b_disease_pest_full_all_e5_len2048_liger_lr1e5_final/v0-20260531-231355/checkpoint-165
outputs:
  run_root: outputs/runs/vlm/vlm-direct-m1-reproduction-formal618-dp4-v1/
parameters:
  entrypoint: scripts/vlm/run_direct_formal618_native_dp8.sh
  formal_root: outputs/runs/vlm/vlm-direct-m1-reproduction-formal618-dp4-v1/formal618-native-dp4
  local_launch: {cuda_visible_devices: '4,5,6,7', nproc_per_node: 4, pytorch_cuda_alloc_conf: 'expandable_segments:True'}
  runtime: {launcher: sglang.launch_server, tensor_parallel_size: 1, data_parallel_size: 4, require_visible_gpu_product: true}
  routes: [{id: candidate_direct, max_concurrent: 64}, {id: m1_direct, max_concurrent: 64}, {id: raw_base_direct, max_concurrent: 64}]
  paired_bootstrap: {samples: 10000, seed: 20260819}
tags: [formal-evaluation, direct, m1, reproduction, native-sglang, dp4, parallel-safe]
