schema_version: agrinet.experiment/v1
id: vlm-hcv-v9-protocol-retention-eval-queue-v1
display_name: {en: HCV v9 protocol-retention DP8 evaluation queue, zh: HCV v9 协议与 Direct 保持 DP8 评测队列}
domain: vlm
task: sft_checkpoint_evaluation_queue
description: >-
  Train one conservative HCV v9 checkpoint and require a strict 64-row native
  DP8 RAG smoke before its formal Direct/RAG paired evaluation and promotion
  gates. The v8 route remains historical and cannot be resumed through this queue.
lifecycle: active
components: {model: outputs/vlm_sft/qwen3_vl_4b_hcv_manual_json_v9_protocol_retention_8gpu, runtime: runtime/local-a800-8gpu-train-and-eval, retrieval: local_agrinet_rag_api, baseline_model: models/Qwen3-VL-4B-Instruct}
runtime_profile: runtime/local-a800-8gpu-train-and-eval
inputs:
  config: configs/vlm/qwen3_vl_4b_hcv_manual_json_v9_protocol_retention_8gpu_sft.yaml
  immutable_source: outputs/artifacts/datasets/agrinet-hcv-manual-json-v9-protocol-retention/validation.json
  formal_manifest: outputs/vlm_eval/qwen3_vl_4b_rag_sft/bounded_latest_sft_rag_test_20260804/manifest.jsonl
outputs:
  model: outputs/vlm_sft/qwen3_vl_4b_hcv_manual_json_v9_protocol_retention_8gpu
  run_root: outputs/runs/vlm/vlm-hcv-v9-protocol-retention-eval-queue-v1/
parameters:
