schema_version: agrinet.micu-classifier-hcv-v2/v1
status: e2_exploration_execution
teacher:
  service: micu_slb
  model: gpt-5.6-terra
  prompt_version: classifier-hcv-v2-unified-router-v1
student:
  model: models/Qwen3-VL-4B-Instruct
  weights: original
  priority: small_model_learnability
classifier:
  prediction_kind: out_of_fold
  prediction_kinds: [out_of_fold, p6_class_holdout]
  checkpoint: outputs/artifacts/vision/openagri-v3-known-vitl-oof-v2/fold-artifacts/fold-0/classifier/model_best.pth.tar
  training_manifest: outputs/artifacts/vision/openagri-v3-known-vitl-oof-v2/fold-artifacts/fold-0/manifests/train.jsonl
  oof_audit: outputs/artifacts/vision/openagri-v3-known-vitl-oof-v2/oof_audit.json
  merged_predictions: outputs/artifacts/vision/openagri-v3-known-vitl-oof-v2/predictions_oof_v2.jsonl
  p6_artifact_roots:
    - outputs/artifacts/vision/openagri-v3-known-vitl-p6-holdout-v1/group-0
    - outputs/artifacts/vision/openagri-v3-known-vitl-p6-holdout-v1/group-1
    - outputs/artifacts/vision/openagri-v3-known-vitl-p6-holdout-v1/group-2
  known_classes: 107
  unknown_classes: 104
  visible_top_k: 3
  stored_top_k: 5
retrieval:
  endpoint: http://127.0.0.1:8077
  collections: [open_agri_v3_classes, open_agri_v3_images]
  registry_visibility: complete
  p6_holdout_exclusion: false
  exposed_modes: [visual, semantic]
  top_k: 3
  budget_schedule: [0, 1, 3, 5]
data:
  stage: exploration
  dataset_version: open_agri_v3
  independent_images: 160
  cells: [open-en-disease, open-en-pest, open-zh-disease, open-zh-pest, option-en-disease, option-en-pest, option-zh-disease, option-zh-pest]
  images_per_cell: 20
  sampling_arms: {targeted: 80, random: 80}
  source: outputs/artifacts/micu-classifier-hcv-e2/exploration-v1/source.jsonl
  exclusions: outputs/artifacts/micu-classifier-hcv-e2/exploration-v1/exclusions.json
  final_test_selection: false
  formal_unknown_sft: false
routing:
  initial_candidate_injection: false
  dynamic_router: true
  one_primary_pattern_per_query: true
  primary_pattern_assigned_by_private_audit: true
  allowed_patterns: [P1, P2, P3, P4, P5, P6, P7, P8, P9, P10]
  g1_strategy: model_rewrite_from_full_public_trace
  g1_g2_max_images: 20
  g1_g2_max_per_pattern: 2
budgets:
  parent_micu: 1120
  parent_audits: 160
  derivation_micu: 360
  capability_checks: 10
  total_micu: 1650
  rag_total: 900
  student_trajectories: 160
  student_generation_requests: 1120
  student_rag_calls: 800
runtime:
  # Parent and first derivation run used 1 while diagnosing endpoint delivery.
  # New, separately recorded retry attempts may use four workers; each keeps an
  # independent ledger and never replays an ambiguous original request.
  micu_max_concurrency: 4
  micu_timeout_seconds: 180
  micu_max_output_tokens: 8192
  teacher_temperature: 0.0
  teacher_top_p: 1.0
  no_automatic_replay: true
  unknown_delivery_requires_status_check: true
  training_eligible: false
  preview_training_eligible: false
qualification:
  sft_may_start: false
  stable_rounds_required: 2
  human_confirmation_required: true
  formal_unknown_in_sft: false
  audit_report_terminates_goal: true
