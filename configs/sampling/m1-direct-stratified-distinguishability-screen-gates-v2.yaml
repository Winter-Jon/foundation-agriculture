schema_version: agrinet.m1-direct-acceptance-gates/v1
immutable_after_first_remote_request: true

# v2 changes candidate coverage only.  The acceptance threshold and all
# fail-closed conditions are intentionally identical to v1.
stratified_distinguishability_screen:
  cells:
    question_types: [open, option]
    languages: [en, zh]
    domains: [disease, pest]
  candidates_per_cell: 32
  minimum_passed_per_cell: 8
  zero_tolerance:
    - unknown_delivery
    - label_leakage
    - protocol_error
    - format_error
    - invisible_fact
