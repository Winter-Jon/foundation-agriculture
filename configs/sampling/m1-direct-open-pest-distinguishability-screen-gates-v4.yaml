schema_version: agrinet.m1-direct-acceptance-gates/v1
immutable_after_first_remote_request: true

# Fresh recovery screen after v7 transport uncertainty. Pass criteria are
# unchanged; capacity remains 32 candidates per language cell.
open_pest_distinguishability_screen:
  cells:
    question_type: open
    languages: [en, zh]
    domain: pest
  candidates_per_cell: 32
  minimum_passed_per_cell: 8
  zero_tolerance:
    - unknown_delivery
    - label_leakage
    - protocol_error
    - format_error
    - invisible_fact
