schema_version: agrinet.m1-direct-acceptance-gates/v1
immutable_after_first_remote_request: true

# v2 preserves the v1 criteria verbatim. It is a fresh independent image draw,
# not a post-hoc relaxation of the v1 failure.
open_pest_distinguishability_screen:
  cells:
    question_type: open
    languages: [en, zh]
    domain: pest
  candidates_per_cell: 16
  minimum_passed_per_cell: 8
  zero_tolerance:
    - unknown_delivery
    - label_leakage
    - protocol_error
    - format_error
    - invisible_fact
