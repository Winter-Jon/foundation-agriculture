schema_version: agrinet.e316-rag-discriminator/v1
status: designed_not_launched
predecessors: [e314-hcv-audit-v1-terminal, e315-option-format-repair-v1]
audit: {images: 32, exclude_prior_audit_identity_layers: [sample_id, image_sha256, source_group_id, near_duplicate_group_id], route_winners_per_arm: [direct, classifier, rag]}
rag_teacher_contract:
  first_search: leading_candidate_vs_nearest_visually_confusable_alternative
  required_arguments: [query, retrieval_type, rationale]
  retrieval_type_values: [visual, semantic]
  query_one_shot_label_agnostic: true
  final_evidence_labels: ['Visible trait:', 'RAG evidence:', 'Discriminator:']
  nearest_alternative_must_be_rejected: true
  unsupported_specific_answer_forbidden: true
  abstain_after_actual_rag_when_discriminator_unresolved: true
protocol: {strict_hermes_final: true, strict_native_tool_schema: true, actual_tool_response_required: true, pure_pretool_think_wire_combination_normalized: true, classifier_predict_once: true, classifier_expand_max: 1, rag_searches: [1, 3], private_truth_isolation: true}
recovery: {rounds: [R0, R1, R2], replay_only: unresolved_provider_delivery, r2_terminal: delivery_shortfall}
gates: {training_eligible: false, training_authorized: false, sft_may_start: false}
