# ms-swift SFT smoke config for AgriNet disease/pest EN+ZH messages.
model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
torch_dtype: bfloat16
attn_impl: sdpa

tuner_type: lora
lora_rank: 8
lora_alpha: 32
target_modules: all-linear

dataset:
  - outputs/vlm_sft/disease_pest_test/sft_messages_en_zh.jsonl
split_dataset_ratio: 0.05
streaming: false
max_length: 8192

num_train_epochs: 1
max_steps: 20
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
learning_rate: 1.0e-4
gradient_accumulation_steps: 4
eval_steps: 10
save_steps: 10
save_total_limit: 2
logging_steps: 1
output_dir: outputs/vlm_sft/qwen3_vl_4b_disease_pest_test
warmup_ratio: 0.05
dataloader_num_workers: 4
dataset_num_proc: 4
report_to:
  - tensorboard
