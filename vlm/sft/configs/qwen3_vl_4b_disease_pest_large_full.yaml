# Full-data, longer ms-swift SFT config for AgriNet disease/pest EN+ZH.
model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
torch_dtype: bfloat16
attn_impl: sdpa

tuner_type: lora
lora_rank: 8
lora_alpha: 32
target_modules: all-linear

dataset:
  - outputs/vlm_sft/disease_pest_large/sft_messages_en_zh.jsonl
split_dataset_ratio: 0.0
streaming: false
max_length: 8192

num_train_epochs: 5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
learning_rate: 1.0e-4
gradient_accumulation_steps: 8
save_steps: 100
save_total_limit: 3
logging_steps: 5
output_dir: outputs/vlm_sft/qwen3_vl_4b_disease_pest_large_full
warmup_ratio: 0.05
dataloader_num_workers: 8
dataset_num_proc: 8
deepspeed: zero2
report_to:
  - tensorboard
