# Full-parameter SFT: higher LR, train ViT, LLM, and aligner.
model: models/Qwen3-VL-4B-Instruct
model_type: qwen3_vl
template: qwen3_vl
torch_dtype: bfloat16
attn_impl: sdpa
use_liger_kernel: true

tuner_type: full
freeze_vit: false
freeze_llm: false
freeze_aligner: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
vit_gradient_checkpointing: true

dataset:
  - outputs/vlm_sft/disease_pest_large/sft_messages_en_zh.jsonl
split_dataset_ratio: 0.0
streaming: false
max_length: 2048

num_train_epochs: 5
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
learning_rate: 1.0e-5
gradient_accumulation_steps: 16
save_steps: 100
save_total_limit: 2
logging_steps: 5
output_dir: outputs/vlm_sft/qwen3_vl_4b_disease_pest_full_all_e5_len2048_liger_lr1e5
warmup_ratio: 0.05
dataloader_num_workers: 8
dataset_num_proc: 8
deepspeed: zero3
report_to:
  - tensorboard
